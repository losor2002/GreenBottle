spring.application.name=GreenBottle
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/greenbottledb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#Only for testing
spring.datasource.username=root
spring.datasource.password=root
server.error.path=/error
server.error.whitelabel.enabled=false
# Behind the Cloudflare tunnel: honor X-Forwarded-* so redirects use https.
server.forward-headers-strategy=framework
# Cache delle risorse statiche (GreenIT: Expires/Cache-Control su tutti gli asset).
# Il content-hash versiona gli URL generati da th:@{...}: il max-age lungo è quindi sicuro.
spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
# HTTP/2 lato server (h2c su HTTP, h2 su HTTPS). Il browser negozia h2 solo in TLS.
server.http2.enabled=true