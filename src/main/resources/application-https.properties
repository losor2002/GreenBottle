# Profilo per le verifiche locali: HTTPS su 8443 cosi il browser negozia HTTP/2.
# Il profilo di default resta in HTTP sulla 8080 (usato da Docker e dal tunnel).
# Richiede il keystore self-signed in target/dev-keystore.p12, generabile con:
#   keytool -genkeypair -alias greenbottle -keyalg RSA -keysize 2048 -storetype PKCS12 \
#     -keystore target/dev-keystore.p12 -validity 3650 -storepass changeit -keypass changeit \
#     -dname "CN=localhost, OU=GreenBottle, O=GreenBottle, L=Salerno, C=IT" \
#     -ext "SAN=dns:localhost,ip:127.0.0.1" -noprompt
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:target/dev-keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=greenbottle
server.http2.enabled=true
