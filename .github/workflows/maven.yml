# CI: build & test on GitHub-hosted runners.
# CD: rebuild and restart the Docker Compose stack on a self-hosted Debian/ARM64
#     runner (Raspberry Pi) whenever the dev branch is updated.
name: Java CI/CD with Maven

on:
  push:
    branches: [ "sse-improvements" ]
  pull_request:
    branches: [ "sse-improvements"]

env:
  DB_DATABASE: greenbottledb
  DB_USER: root
  DB_PASSWORD: root

concurrency:
  group: greenbottle-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Set up MySQL
        run: |
          sudo /etc/init.d/mysql start
          mysql -e 'CREATE DATABASE ${{ env.DB_DATABASE }};' -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }}
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw -B package --file pom.xml

  deploy:
    name: Deploy on Raspberry Pi
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: [ self-hosted, linux, ARM64 ]
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: |
          cat > .env <<EOF
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          EOF
      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --build
          docker compose ps